:root{--g:#3A4536;--g2:#5A6B55;--cream:#F6F3EE;--c2:#C8C0AE;--gold:#A9824A;--ink:#1a1a14;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body:not(.ar){font-family:'EB Garamond',serif;color:var(--ink);}
body.ar{font-family:'Aligarh',serif;color:var(--ink);}
.lang-bar{position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(58,69,54,.97);backdrop-filter:blur(8px);
  display:flex;justify-content:center;gap:4px;padding:8px 16px;}
.lb{font-family:'EB Garamond',serif;font-size:.8rem;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(246,242,234,.6);background:none;
  border:1px solid rgba(246,242,234,.2);border-radius:999px;
  padding:5px 14px;cursor:pointer;transition:all .2s;}
.lb:hover{color:#F6F3EE;border-color:var(--gold);}
.lb.active{color:var(--gold);border-color:var(--gold);font-weight:600;}
/* LANDING */
.landing{position:fixed;inset:0;background:var(--g);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:0 24px;
  transition:opacity .45s ease,visibility .45s ease;
  opacity:1;visibility:visible;}
.landing.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo{width:80px;height:80px;object-fit:contain;
  opacity:0;animation:logoIn .9s .3s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes logoIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.splash-title{font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(2.4rem,9vw,4.2rem);color:#F6F3EE;letter-spacing:.18em;
  opacity:0;animation:slideUp .8s .9s ease forwards;margin-top:16px;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.splash-line{width:0;height:1px;background:var(--gold);margin:14px auto;
  animation:lineGrow .5s 1.5s ease forwards;}
@keyframes lineGrow{to{width:60px}}
.splash-elaf{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;
  font-size:.72rem;color:rgba(246,242,234,.5);
  opacity:0;animation:fadeIn .5s 1.7s ease forwards;margin-bottom:48px;}
@keyframes fadeIn{to{opacity:1}}
.splash-choose{font-family:'Cormorant Garamond',serif;font-size:.78rem;
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(246,242,234,.45);opacity:0;
  animation:fadeIn .5s 2s ease forwards;margin-bottom:20px;}
.menu-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  opacity:0;animation:slideUp .7s 2.1s ease forwards;}
.menu-card{background:rgba(246,242,234,.06);border:1px solid rgba(246,242,234,.15);
  border-radius:16px;padding:28px 32px;cursor:pointer;text-align:center;
  min-width:155px;max-width:220px;flex:1;transition:all .25s;
  position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.menu-card::before{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(169,130,74,.15),transparent);
  opacity:0;transition:opacity .25s;}
.menu-card:active{border-color:var(--gold);transform:translateY(-2px);}
.menu-card:hover{border-color:var(--gold);transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(0,0,0,.3);}
.menu-card:hover::before,.menu-card:active::before{opacity:1;}
.card-icon{font-size:2rem;margin-bottom:10px;}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;
  font-weight:500;color:#F6F3EE;letter-spacing:.06em;margin-bottom:4px;}
.card-sub{font-size:.78rem;color:rgba(246,242,234,.45);letter-spacing:.06em;}
body.ar .card-title{font-family:'Aligarh',serif;font-size:1.5rem;letter-spacing:0;}
body.ar .card-sub{font-family:'Aligarh',serif;letter-spacing:0;}
body.ar .splash-choose{font-family:'Aligarh',serif;letter-spacing:.04em;}
body.ar .splash-elaf{font-family:'Aligarh',serif;letter-spacing:.06em;}
/* MENU VIEW */
.menu-view{display:none;min-height:100vh;background:var(--cream);}
.menu-view.active{display:block;}
.back-bar{position:sticky;top:41px;z-index:99;background:var(--g);
  display:flex;align-items:center;gap:16px;padding:10px 20px;}
.back-btn{font-family:'Cormorant Garamond',serif;font-size:.82rem;
  letter-spacing:.1em;color:rgba(246,242,234,.8);text-transform:uppercase;
  border:none;background:none;cursor:pointer;
  padding:4px 10px 4px 0;border-right:1px solid rgba(246,242,234,.2);
  transition:color .2s;-webkit-tap-highlight-color:transparent;}
.back-btn:hover,.back-btn:active{color:var(--gold);}
.menu-id-label{font-family:'Cormorant Garamond',serif;font-size:.82rem;
  letter-spacing:.16em;color:var(--gold);text-transform:uppercase;}
body.ar .back-bar{flex-direction:row-reverse;}
body.ar .back-btn{border-right:none;border-left:1px solid rgba(246,242,234,.2);
  padding:4px 0 4px 10px;font-family:'Aligarh',serif;letter-spacing:.04em;}
body.ar .menu-id-label{font-family:'Aligarh',serif;letter-spacing:.04em;}
.catnav{position:sticky;top:82px;z-index:98;background:var(--cream);
  border-bottom:1.5px solid var(--c2);display:flex;overflow-x:auto;
  gap:6px;padding:10px 16px;scrollbar-width:none;}
.catnav::-webkit-scrollbar{display:none;}
.catnav a{flex:0 0 auto;font-family:'Cormorant Garamond',serif;font-size:.74rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  text-decoration:none;padding:6px 12px;border:1px solid var(--c2);
  border-radius:999px;white-space:nowrap;transition:all .15s;}
.catnav a:hover,.catnav a:active{background:var(--g);color:var(--cream);border-color:var(--g);}
body.ar .catnav{direction:rtl;}
body.ar .catnav a{font-family:'Aligarh',serif;font-size:1rem;letter-spacing:0;}
.menu-hero{background:var(--g);color:var(--cream);padding:52px 24px 44px;
  text-align:center;position:relative;overflow:hidden;}
.menu-hero::before{content:"";position:absolute;inset:16px;
  border:1px solid rgba(246,242,234,.15);pointer-events:none;}
.hero-logo{width:58px;height:58px;object-fit:contain;margin-bottom:12px;}
.hero-title{font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(1.8rem,6vw,3rem);letter-spacing:.18em;}
.hero-div{width:46px;height:1px;background:var(--gold);margin:11px auto;}
.hero-sub{font-size:.77rem;letter-spacing:.22em;color:rgba(246,242,234,.7);}
body.ar .hero-sub{font-family:'Aligarh',serif;letter-spacing:.04em;font-size:.95rem;}
.wrap{max-width:780px;margin:0 auto;padding:8px 20px 48px;}
section.cat{padding-top:48px;scroll-margin-top:128px;}
.cat-head{text-align:center;margin-bottom:22px;}
.kick{font-family:'Cormorant Garamond',serif;letter-spacing:.26em;
  font-size:.68rem;color:var(--gold);text-transform:uppercase;}
.cat-head h2{font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:clamp(1.55rem,5vw,2.1rem);color:var(--g);margin:4px 0 2px;}
.cat-sub{font-style:italic;color:#3e3a35;font-size:.92rem;}
.div-line{display:flex;align-items:center;justify-content:center;
  gap:10px;margin:11px 0 5px;}
.div-line span{height:1px;width:36px;background:var(--c2);display:block;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--c2);}
.grp-label{font-family:'Cormorant Garamond',serif;letter-spacing:.14em;
  font-size:.7rem;text-transform:uppercase;color:#2e2a26;font-weight:600;
  border-bottom:1.5px solid var(--c2);padding-bottom:6px;margin:18px 0 10px;}
body.ar .grp-label{letter-spacing:0;font-family:'Aligarh',serif;
  font-size:1.05rem;text-align:right;direction:rtl;font-weight:400;}
.cols{display:grid;grid-template-columns:1fr;gap:0 40px;}
@media(min-width:580px){.cols.two{grid-template-columns:1fr 1fr;}}
.item{padding:7px 0;}
.item-row{display:flex;align-items:baseline;gap:6px;}
body.ar .item-row{direction:rtl;}
.nm{font-family:'EB Garamond',serif;font-weight:500;font-size:1rem;color:#18180f;}
body.ar .nm{font-family:'Aligarh',serif;font-size:1.15rem;color:#18180f;}
.fill{flex:1;border-bottom:1px dotted #b8b0a0;transform:translateY(-4px);}
.pr{font-family:'Cormorant Garamond',serif;color:var(--gold);
  font-weight:600;font-size:1rem;white-space:nowrap;}
body.ar .pr{font-family:'Aligarh',serif;font-size:1.05rem;}
.desc{font-style:italic;font-size:.81rem;color:#3e3a34;
  margin-top:2px;line-height:1.35;}
body.ar .desc{font-style:normal;font-family:'Aligarh',serif;
  font-size:.95rem;text-align:right;direction:rtl;color:#2e2b27;}
body.ar .cat-head{text-align:right;direction:rtl;}
body.ar .cat-head .kick{display:block;text-align:right;
  font-family:'Aligarh',serif;letter-spacing:.03em;font-size:.9rem;}
body.ar .cat-head h2{font-family:'Aligarh',serif;}
body.ar .cat-head .cat-sub{font-style:normal;font-family:'Aligarh',serif;
  font-size:1rem;color:#2e2b27;}
body.ar .div-line{direction:ltr;}
.prix-note{text-align:center;font-size:.67rem;letter-spacing:.18em;
  color:#5a554e;margin-top:28px;text-transform:uppercase;}
body.ar .prix-note{font-family:'Aligarh',serif;letter-spacing:.03em;font-size:.82rem;}
footer{background:var(--g);color:var(--cream);text-align:center;
  padding:48px 24px 40px;}
.foot-msg{font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.4rem;margin:12px 0 5px;}
body.ar .foot-msg{font-family:'Aligarh',serif;font-style:normal;font-size:1.55rem;}
.foot-brand{font-family:'Cormorant Garamond',serif;letter-spacing:.22em;
  font-size:.88rem;color:var(--gold);}
.foot-s{font-size:.67rem;letter-spacing:.2em;
  color:rgba(246,242,234,.5);margin-top:4px;}
body.ar .foot-s{font-family:'Aligarh',serif;letter-spacing:.03em;font-size:.82rem;}
</style>
</head>

let LANG='fr',VIEW='landing';
function t(o){return(o&&(o[LANG]||o.fr))||'';}
function td(o){if(!o)return '';return o[LANG]||o.en||'';}

function setLang(l){
  LANG=l;
  const r=document.documentElement;
  r.lang=l;r.dir=l==='ar'?'rtl':'ltr';
  document.body.classList.toggle('ar',l==='ar');
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  if(VIEW==='landing')renderLanding();
  else renderMenuView(VIEW);
}

function renderLanding(){
  document.getElementById('splash-choose').textContent=t(UI.landing_choose);
  document.getElementById('splash-elaf').textContent=t(UI.landing_elaf);
  document.getElementById('card-b-title').textContent=t(UI.breakfast_label);
  document.getElementById('card-b-sub').textContent=t(UI.breakfast_sub);
  document.getElementById('card-m-title').textContent=t(UI.main_label);
  document.getElementById('card-m-sub').textContent=t(UI.main_sub);
}

function showMenu(which){
  VIEW=which;
  const landing=document.getElementById('landing');
  landing.classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('menu-'+which).classList.add('active');
    window.scrollTo({top:0,behavior:'instant'});
    renderMenuView(which);
  },460);
}

function goBack(){
  VIEW='landing';
  document.querySelectorAll('.menu-view').forEach(v=>v.classList.remove('active'));
  const landing=document.getElementById('landing');
  // iOS Safari fix: forcer un reflow avant de remettre visible
  landing.style.opacity='0';
  landing.style.visibility='hidden';
  void landing.offsetWidth; // flush layout
  landing.classList.remove('hidden');
  landing.style.opacity='';
  landing.style.visibility='';
  renderLanding();
}

function renderMenuView(which){
  const data=which==='breakfast'?B:M;
  const el=document.getElementById('menu-'+which);
  const isAr=LANG==='ar';
  el.querySelector('.back-btn').textContent=t(UI.back);
  el.querySelector('.menu-id-label').textContent=t(which==='breakfast'?UI.breakfast_label:UI.main_label);
  el.querySelector('.hero-sub').textContent=
    which==='breakfast'
      ?(isAr?'إفطار':'PETIT-DÉJEUNER · BREAKFAST')
      :(isAr?'القائمة الرئيسية':LANG==='en'?'MAIN MENU':'MENU PRINCIPAL');
  el.querySelector('.catnav').innerHTML=data.map(s=>
    `<a href="#${s.id}-${which}">${t(s.nav)}</a>`
  ).join('');
  let h='';
  for(const sec of data){
    h+=`<section class="cat" id="${sec.id}-${which}">
      <div class="cat-head">
        <div class="kick">${t(sec.kick)}</div>
        <h2>${t(sec.title)}</h2>
        <div class="cat-sub">${t(sec.sub)}</div>
        <div class="div-line"><span></span><span class="dot"></span><span></span></div>
      </div>`;
    for(const grp of sec.groups){
      h+=`<div class="grp-label">${t(grp.label)}</div><div class="cols${grp.layout==='two'?' two':''}">`;
      for(const item of grp.items){
        const d=td(item.desc);
        h+=`<div class="item"><div class="item-row">
          <span class="nm">${t(item.name)}</span>
          <span class="fill"></span>
          <span class="pr">${item.price}</span>
        </div>${d?`<div class="desc">${d}</div>`:''}</div>`;
      }
      h+='</div>';
    }
    h+='</section>';
  }
  h+=`<div class="prix-note">${t(which==='breakfast'?UI.prix_b:UI.prix_m)}</div>`;
  el.querySelector('.menu-content').innerHTML=h;
  el.querySelector('.foot-msg').textContent=t(UI.foot_msg);
  el.querySelector('.foot-s').textContent=t(UI.foot_sub);
}
